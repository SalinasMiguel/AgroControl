spring.application.name=AgroControl

spring.datasource.url=${AGROCONTROL_DB_URL:jdbc:postgresql://localhost:5432/agrocontrol}
spring.datasource.username=${AGROCONTROL_DB_USER:postgres}
spring.datasource.password=${AGROCONTROL_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Imprime en consola cada SQL que ejecuta Hibernate: evidencia en vivo de que una operación llegó a PostgreSQL
spring.jpa.show-sql=true

spring.flyway.enabled=true
# db/demo trae los datos de ejemplo; el perfil produccion usa db/produccion en su lugar
spring.flyway.locations=classpath:db/migration,classpath:db/demo
agrocontrol.demo=true

# Orígenes autorizados por CORS: web React (Vite dev 5173, vite preview 4173) y app móvil en modo web (Expo, 8081). Separar varios con coma.
agrocontrol.cors.allowed-origins=${AGROCONTROL_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8081}

springdoc.swagger-ui.path=/swagger-ui.html

# Firma de los JWT del login (HS256, mínimo 32 caracteres). En producción, definirla por variable de entorno.
agrocontrol.jwt.secret=${AGROCONTROL_JWT_SECRET:agrocontrol-clave-de-desarrollo-cambiar-en-produccion}
agrocontrol.jwt.horas=${AGROCONTROL_JWT_HORAS:8}
